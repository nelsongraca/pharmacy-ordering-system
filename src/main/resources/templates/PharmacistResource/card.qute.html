{#if view.message}
    <p>{view.message}</p>
{/if}
{#if view.card}
    <article>
        <h2>Ticket {view.card.id}</h2>
        <p>{view.card.code} — {view.card.status}</p>
        <ul>
            {#for line in view.card.lines}
                <li>{line.medication} × {line.amount}</li>
            {/for}
        </ul>
        {#if view.card.status == 'IN_REVIEW'}
            <button hx-post="/pharmacist/approve/{view.card.id}" hx-target="#card" hx-swap="innerHTML">Approve</button>
            <button hx-post="/pharmacist/reject/{view.card.id}" hx-target="#card" hx-swap="innerHTML">Reject</button>
        {#else if view.card.status == 'READY'}
            <button hx-post="/pharmacist/call/{view.card.id}" hx-target="#card" hx-swap="innerHTML">Call patient</button>
            <button hx-post="/pharmacist/handover/{view.card.id}" hx-target="#card" hx-swap="innerHTML">Handed over</button>
        {/if}
    </article>
{/if}
