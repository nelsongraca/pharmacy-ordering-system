<div class="columns">
    <section>
        <h2>Preparing</h2>
        <ul data-column="preparing">
            {#for ticket in view.preparing}
                <li class="ticket" data-id="{ticket.id}" data-calling="{ticket.calling}" data-sort-key="{ticket.sortKey}">
                    <span class="number">{ticket.id}</span>
                    <small>{ticket.stage}</small>
                </li>
            {/for}
        </ul>
    </section>

    <section>
        <h2>Ready</h2>
        <ul data-column="ready">
            {#for ticket in view.ready}
                <li class="ticket{#if ticket.calling} calling{/if}" data-id="{ticket.id}" data-calling="{ticket.calling}" data-sort-key="{ticket.sortKey}">
                    <span class="number">{ticket.id}</span>
                    {#if ticket.calling}<small>Now calling</small>{/if}
                </li>
            {/for}
        </ul>
    </section>

    <section>
        <h2>See pharmacist</h2>
        <ul data-column="seePharmacist">
            {#for ticket in view.seePharmacist}
                <li class="ticket" data-id="{ticket.id}" data-calling="{ticket.calling}" data-sort-key="{ticket.sortKey}">
                    <span class="number">{ticket.id}</span>
                    <small>{ticket.stage}</small>
                </li>
            {/for}
        </ul>
    </section>
</div>
