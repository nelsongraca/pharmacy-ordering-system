<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {#bundle /}
  <title></title>
</head>
<body>
<main>
  <h2 id="feedback"></h2>
  <form>
    <fieldset>
      <label>
        Please Enter your prescription number
        <input id="prescription-input"
                name="prescription_number"
                placeholder="P-12345"
                pattern="P-[0-9]}{5}"
               required="required"
        />
      </label>
    </fieldset>

    <input hx-post="/order/submit"
           hx-target="#feedback"
           hx-on::after-request="clearAfter('#feedback', 5000); clearAfter('#prescription-input', 5000);"

            type="submit"
            value="OK"
    />
  </form>
</main>
</body>
</html>
